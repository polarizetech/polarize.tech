name: changelog

# Refreshes the changelog and repository pages (scripts/sync_changelog.py:
# _data/changelog.json, _data/repos.json and the generated stubs under
# changelog/) and, when anything changed, commits it so GitHub Pages rebuilds. The explicit
# Pages build request is there because a push made with the workflow's own
# GITHUB_TOKEN is not guaranteed to trigger one.

on:
  schedule:
    - cron: "17 9 * * *"   # once a day, 09:17 UTC; run it by hand any time (Actions → changelog → Run workflow)
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync changelog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/sync_changelog.py

      - name: Commit and rebuild Pages if changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add -A -- _data/changelog.json _data/repos.json changelog/
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Changelog: sync merged PRs and repositories"
          git pull --rebase
          git push
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" || true
