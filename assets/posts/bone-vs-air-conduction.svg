<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img"
     aria-label="Air conduction reaches one ear at a time; bone conduction reaches both cochleae at once, so it cannot deliver a per-ear stimulus.">
  <title>Air conduction versus bone conduction: interaural attenuation</title>
  <style>
    .bg{fill:#0e1116}
    .head{fill:none;stroke:#4a5568;stroke-width:2}
    .lbl{font:600 13px system-ui,-apple-system,sans-serif;fill:#e2e8f0}
    .sub{font:11px system-ui,-apple-system,sans-serif;fill:#94a3b8}
    .num{font:700 15px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#f0f4f8}
    .air{fill:none;stroke:#4ade80;stroke-width:2.5}
    .bone{fill:none;stroke:#fb923c;stroke-width:2.5}
    .coch{fill:#1e293b;stroke:#64748b;stroke-width:1.5}
    .cap{font:600 12px system-ui,-apple-system,sans-serif;fill:#cbd5e1}
  </style>
  <rect class="bg" width="720" height="380"/>

  <!-- LEFT: air conduction -->
  <text class="lbl" x="40" y="34">Air conduction</text>
  <text class="sub" x="40" y="52">a sealed transducer at one ear</text>
  <ellipse class="head" cx="180" cy="180" rx="86" ry="100"/>
  <circle class="coch" cx="112" cy="180" r="15"/>
  <circle class="coch" cx="248" cy="180" r="15"/>
  <rect x="72" y="164" width="16" height="32" rx="3" fill="#4ade80"/>
  <path class="air" d="M92 180 H105"/>
  <path class="air" stroke-dasharray="4 5" d="M127 180 H233" opacity="0.35"/>
  <text class="cap" x="88" y="238">signal</text>
  <text class="num" x="122" y="300">≈ 40–60 dB</text>
  <text class="sub" x="98" y="318">interaural attenuation</text>
  <text class="sub" x="112" y="336">two independent ears</text>

  <!-- divider -->
  <line x1="360" y1="30" x2="360" y2="350" stroke="#334155" stroke-width="1"/>

  <!-- RIGHT: bone conduction -->
  <text class="lbl" x="400" y="34">Bone conduction</text>
  <text class="sub" x="400" y="52">a transducer on the skull</text>
  <ellipse class="head" cx="540" cy="180" rx="86" ry="100"/>
  <circle class="coch" cx="472" cy="180" r="15"/>
  <circle class="coch" cx="608" cy="180" r="15"/>
  <rect x="432" y="150" width="16" height="26" rx="3" fill="#fb923c"/>
  <path class="bone" d="M450 163 Q500 120 560 150"/>
  <path class="bone" d="M452 172 Q470 180 465 180"/>
  <path class="bone" d="M560 150 Q596 160 604 172"/>
  <text class="cap" x="446" y="238">signal</text>
  <text class="num" x="486" y="300">≈ 0–10 dB</text>
  <text class="sub" x="444" y="318">interaural attenuation</text>
  <text class="sub" x="430" y="336">the skull couples both cochleae</text>
</svg>
