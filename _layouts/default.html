<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% if page.title %}{{ page.title }} — POLARIZE{% else %}{{ site.title }} — {{ site.tagline }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_newlines | escape }}" />
  <link rel="canonical" href="{{ page.url | absolute_url }}" />
  <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
  <link href="https://api.fontshare.com/v2/css?f[]=familjen-grotesk@400,500,600,700,800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ '/styles.css' | relative_url }}" />
  {%- feed_meta %}
</head>
<body class="page">

  {% include nav.html %}

  <main class="doc">
    {{ content }}
  </main>

  {% include footer.html %}

</body>
</html>
