<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% if page.title %}{{ page.title }} — POLARIZE{% else %}{{ site.title }} — {{ site.tagline }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_newlines | escape }}" />
  <link rel="canonical" href="{{ page.url | absolute_url }}" />
  <link rel="stylesheet" href="{{ '/design/design.css' | relative_url }}" />
  <link rel="stylesheet" href="{{ '/styles.css' | relative_url }}" />
  <script type="module" src="{{ '/design/design.js' | relative_url }}"></script>
  {%- feed_meta %}
</head>
<body class="ui page">

  <div class="shell">
    {% include sidebar.html %}
    <main class="main">
      {{ content }}
    </main>
  </div>

  {% include footer.html %}

</body>
</html>
