# Schematic plates — real archival anatomical and physiological drawings,
# placed inside longer posts by _includes/schematic-content.html. ONE per post
# at most, never in rants.
#
# Every plate is a real historical figure, public domain or openly licensed,
# run through scripts/prepare_schematic.py (crop, invert, tone, grain). Nothing
# in them is drawn or generated here. Each entry records where the source is,
# its licence, and the exact crop, so every plate can be rebuilt and checked.
#
#   id           the file is assets/schematics/<id>.jpg (1600 x 1067)
#   subject      what it shows — becomes the alt text
#   credit       who made it, what, when (shown in the caption; may hold HTML)
#   license      shown in the caption, linked to source_url
#   source_url   the record the image came from
#   source_file  the exact file or IIIF image that was downloaded
#   crop         the --crop given to prepare_schematic.py
#   projects     the post `project:` values it suits; a post picks among these
#
# A post can choose its plate with `schematic: <id>` or opt out with
# `schematic: none`. How to add one: docs/schematic-visuals.md.

