title: POLARIZE
tagline: Reading and writing the body electric
description: >-
  Research notes on audio-evoked potentials, bioelectricity, neuroscience and
  neuromedicine. Falsification-first, citation-gated.
url: https://polarize.tech
baseurl: ""

permalink: /blog/:title/
timezone: America/Denver

# No theme. GitHub Pages defaults to minima, which would inject its own
# stylesheet and layouts over the hand-built POLARIZE design.
theme: null
encoding: utf-8

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge
  math_engine: null

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-paginate

# jekyll-paginate v1 — the only paginator GitHub Pages runs. It paginates the
# root index.html and nothing else, which is why /blog/ lists everything instead
# of paginating too.
paginate: 8
paginate_path: "/page:num/"

# The address behind the contact button. A plain mailto: on purpose — it opens
# whatever the reader actually uses (Gmail in a browser, Mail.app, Outlook),
# where a Gmail compose URL would only work for Gmail users.
# NOTE: this address is PUBLISHED on every page. Change it here to swap it for
# an alias or a forwarding address.
contact_email: info@joshanderton.com

# Where /contact/'s form posts. LEAVE EMPTY and the form falls back to a mailto:
# submit that opens the reader's own mail client — GitHub Pages is static and
# cannot post a form anywhere by itself. Set this to a deployed
# tools/contact-endpoint URL to get real submissions.
contact_endpoint:

# Google Analytics measurement ID (gtag.js). Rendered only in production builds —
# see _includes/analytics.html. Empty turns analytics off.
google_analytics: G-PYBESLWGR1

# The sidebar's author note. Kept here rather than in a post so it is written
# once. `avatar` is optional — the sidebar renders without it.
author:
  name: "Joshua Anderton"
  location: "Victoria, BC"
  avatar: "/assets/author.jpg"
  note: >-
    I build software for a living and came at this from the computer-science
    side: signals, protocols, and what a measurement can actually support. This
    is where I work through whether the questions I find interesting survive
    contact with an instrument.

feed:
  path: /blog/feed.xml
  collections:
    essays:
      path: /essays/feed.xml

# Essays / rants: short dictated pieces, thinking out loud. Deliberately a
# separate collection, not posts: they carry no claims and no citations, so they
# never enter site.posts, the topic pages or the research feed. Always tier SPEC;
# the gate (validate_posts.py, essays check) enforces all three.
collections:
  essays:
    output: true
    permalink: /essays/:title/

# Human labels for the `project:` front-matter key. This is the only place a
# project's display name and blurb are written; the homepage and the blog index
# both read from here, so a topic cannot be named two different things.
# NOT a citation surface — nothing here is machine-resolved, and nothing here
# may assert a finding.
projects:
  audio-evoked-potentials:
    label: "Audio-evoked potentials"
    blurb: >-
      Whether a designed acoustic protocol can put a specified structure into a
      recorded evoked response — and what a $70 amplifier can and cannot hear.
  bioem-propagation:
    label: "Bioelectromagnetic propagation"
    blurb: >-
      What carries a biological signal out of a body and through the world — and
      what it takes to read it once it is out there.
  biosignal-translation:
    label: "Biosignal translation"
    blurb: >-
      Reading structure out of a waveform without assuming what produced it —
      and the published parallels between collective and neural decision-making.
  invasive-species-bioelectric:
    label: "Invasive species & bioelectricity"
    blurb: >-
      What a European green crab can and cannot sense, computed where the
      numbers exist and refused where they do not — and how the native Pacific
      crabs compare.
  method:
    label: "Method"
    blurb: >-
      How the work is done: build first and narrow later, kill conditions written
      before the measurement, and the difference between a closed door and a
      closed question.

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: essays
    values:
      layout: essay
      tier: SPEC

exclude:
  - README.md
  - CLAUDE.md
  - Gemfile
  - Gemfile.lock
  - scripts/
  - .claude/
  - .github/
  - vendor/
  # design/ is the polarize-ui submodule. Only design.css, publication.css,
  # design.js, tokens.json, fonts/ and icons/ are served; its React source,
  # Storybook and build scripts are not part of this site.
  - design/src
  - design/stories
  - design/shadcn
  - design/.storybook
  - design/node_modules
  - design/package.json
  - design/package-lock.json
  - design/tsconfig.json
  - design/components.json
  - design/build_css.py
  - design/dev_check.py
  - design/CLAUDE.md
  - design/INTEGRATION.md
  - design/README.md
  - design/LICENSE
